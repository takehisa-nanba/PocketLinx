name: Environment bundles

on:
  push:
    paths:
      - 'pkg/environment/**'
      - 'pkg/envrun/**'
      - 'pkg/wslbridge/**'
      - 'scripts/wsl-fixture/**'
      - 'scripts/verify-wsl.ps1'
      - 'cmd/plx-env/**'
      - 'examples/environment/**'
      - 'scripts/verify-environment.sh'
      - '.github/workflows/environment.yml'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - 'pkg/environment/**'
      - 'pkg/envrun/**'
      - 'pkg/wslbridge/**'
      - 'scripts/wsl-fixture/**'
      - 'scripts/verify-wsl.ps1'
      - 'cmd/plx-env/**'
      - 'examples/environment/**'
      - 'scripts/verify-environment.sh'
      - '.github/workflows/environment.yml'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  windows-adapter:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Adapter unit tests (does not verify live WSL)
        run: |
          go test ./pkg/wslbridge ./cmd/plx-env
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -o "$env:RUNNER_TEMP/plx-env.exe" ./cmd/plx-env
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test and inspect
        run: |
          go test -race ./pkg/environment ./pkg/envrun ./pkg/wslbridge ./cmd/plx-env
          go test ./...
          go vet ./...
          go test ./pkg/environment -run '^$' -fuzz FuzzRestore -fuzztime 10s -parallel 2
          go build ./cmd/plx
          GOOS=windows GOARCH=amd64 go build -o /tmp/plx-windows.exe ./cmd/plx
          GOOS=windows GOARCH=amd64 go build -o /tmp/plx-env-windows.exe ./cmd/plx-env
      - name: Alpine shell round trip in disposable Linux container
        run: |
          docker run --rm --network none --cap-add SYS_ADMIN \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --mount "type=bind,source=$PWD,target=/work,readonly" -w /work \
            golang:1.23-alpine@sha256:383395b794dffa5b53012a212365d40c8e37109a626ca30d6151c8348d380b5f \
            sh scripts/verify-environment.sh
      - name: Credentials fail instead of falling back
        run: |
          docker run --rm --network none --cap-add SYS_ADMIN --cap-drop SETUID \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -e PLX_ENV_EXPECT_CREDENTIAL_DENIED=1 \
            --mount "type=bind,source=$PWD,target=/work,readonly" -w /work \
            golang:1.23-alpine@sha256:383395b794dffa5b53012a212365d40c8e37109a626ca30d6151c8348d380b5f \
            sh scripts/verify-environment.sh
